<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
        margin: 8px;
        display: block;
        background-color: #e6f0ff;
      }

      

      .pricing-container {
        display: flex;
        gap: 20px;              
        justify-content: center;
        padding: 100px;
        
      }

  .pricing-plan {
  display: flex;
  flex-direction: column;   
  justify-content: space-between; 
  align-items: center;
  max-width: 200px;
  padding: 20px;
  background-color: #f9f9f9;
  border-radius: 10px;
  box-shadow: 8px 8px 8px rgba(0,0,0,0.1);
}

.plan-button {
  background-color: orange;
  color: white;
  border: none;
  border-radius: 10px 5px;      
  padding: 12px 24px;       
  cursor: pointer;
  font-size: 16px;
  margin-top: auto;       
}

.plan-button:hover {
  background-color: darkorange;
}

.plan-title { font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif ; font-size: 35px; color: blueviolet;


}


.plan-features { font-size: 20px;}
.plan-price { font-size: 25px;}



      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) { .pricing-container {
        flex-direction: column;
        align-items: center;
        gap: 20px;






      }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
